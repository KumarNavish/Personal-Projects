name: Diagnose public raster headers
on:
  push:
    branches: [capability-probes-20260914]
    paths: ['earth_headers/**', '.github/workflows/earth-headers.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: |
          python3 -m venv /tmp/header-env
          /tmp/header-env/bin/pip -q install requests pandas pyarrow rasterio
          /tmp/header-env/bin/python earth_headers/inspect.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raster-headers
          path: header_output/
          retention-days: 2
